<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Masuk ke sistem informasi akuntansi AkunEvent">
  <title>Masuk | AkunEvent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-brand" href="index.html" aria-label="AkunEvent by Citra">
      <span>AkunEvent</span>
      <small>by Citra</small>
    </a>
    <section class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">SISTEM INFORMASI AKUNTANSI</p>
      <h1 id="login-title">Masuk ke AkunEvent</h1>
      <p class="page-description">Gunakan akun yang terdaftar untuk melanjutkan.</p>
      <form class="login-page-form" id="login-form" method="post">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" placeholder="nama@perusahaan.com" required>
        <label for="login-password">Kata sandi</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Kata sandi" required>
        <button class="button button-dark" type="submit">Masuk</button>
      </form>
      <div class="notice" id="login-notice" role="status" aria-live="polite" hidden></div>
    </section>
    <p class="login-footer">Akses data sesuai peran dan izin akun Anda.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../backend/supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
